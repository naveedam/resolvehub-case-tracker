name: Canara ingestion

# Manual only — never runs on push/PR. Leave case_reference blank for a
# full run of the master PDF (the ask this workflow exists for);
# fill it in to test a single record first, same safety pattern as
# ingestion/sbi/adapter.py's --case-reference flag. No ingestion logic
# lives here — this just invokes the existing CanaraAdapter ->
# run_ingestion -> SupabaseStore code path with credentials from
# GitHub Secrets, which never appear in logs or in this file.
on:
  workflow_dispatch:
    inputs:
      case_reference:
        description: "Optional: exact case_reference to ingest alone (e.g. CANARA-48e02e7fafd70ec6). Leave blank for a full run."
        required: false
        type: string

jobs:
  ingest-canara:
    runs-on: ubuntu-latest
    # The master PDF is ~13MB covering every branch nationwide; a full
    # run downloads it once and walks every page. Generous but bounded.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: ingestion/canara/requirements.txt

      - run: pip install -r ingestion/canara/requirements.txt

      - name: Run Canara adapter
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -n "${{ inputs.case_reference }}" ]; then
            python -m ingestion.canara.adapter --case-reference "${{ inputs.case_reference }}"
          else
            python -m ingestion.canara.adapter
          fi
